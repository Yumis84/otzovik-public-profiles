name: Publish company profile

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Company slug
        required: true
        type: string
      mode:
        description: Publication source
        required: true
        default: supabase
        type: choice
        options:
          - supabase
          - legacy-source
      source_ref:
        description: Legacy source repository ref
        required: true
        default: main
        type: string

  repository_dispatch:
    types: [publish-company-profile]

permissions:
  contents: write

jobs:
  publish:
    concurrency:
      group: publish-profile-${{ github.event.client_payload.slug || inputs.slug }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      PROFILE_SLUG: ${{ github.event.client_payload.slug || inputs.slug }}
      PUBLISH_MODE: ${{ inputs.mode || 'supabase' }}

    steps:
      - name: Checkout public build repository
        uses: actions/checkout@v4

      - name: Validate slug
        shell: bash
        run: |
          if [[ ! "${{ env.PROFILE_SLUG }}" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]; then
            echo "Invalid slug"
            exit 1
          fi

      - name: Validate renderer syntax
        if: ${{ env.PUBLISH_MODE == 'supabase' }}
        run: |
          python3 -m py_compile scripts/render-profile.py
          python3 -m py_compile scripts/fetch-profile-media.py

      - name: Fetch canonical public profile from Supabase
        if: ${{ env.PUBLISH_MODE == 'supabase' }}
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_yhqWJ1eWUznBkqKwPogTrw_xCdCbFA-
        run: |
          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 --max-time 30 --max-filesize 2097152 \
            -X POST 'https://rzhlcszqtuhkhfibygnk.supabase.co/rest/v1/rpc/get_public_company_profile_v2' \
            -H 'Content-Type: application/json' \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            --data "{\"p_slug\":\"${{ env.PROFILE_SLUG }}\"}" \
            -o /tmp/profile.json

          python3 - <<'PY'
          import json

          p = '/tmp/profile.json'
          d = json.load(open(p, encoding='utf-8'))

          if not isinstance(d, dict) or not d.get('name'):
              raise SystemExit('Supabase returned no public company profile')
          PY

          python3 scripts/fetch-profile-media.py \
            --data /tmp/profile.json \
            --out "profiles/${{ env.PROFILE_SLUG }}/media" \
            --base-url "https://rzhlcszqtuhkhfibygnk.supabase.co" \
            --key "${SUPABASE_PUBLISHABLE_KEY}"

          python3 scripts/render-profile.py \
            --slug "${{ env.PROFILE_SLUG }}" \
            --data /tmp/profile.json

      - name: Validate generated public artifacts
        if: ${{ env.PUBLISH_MODE == 'supabase' }}
        shell: bash
        run: |
          test -s "profiles/${{ env.PROFILE_SLUG }}/index.html"
          test -s "profiles/${{ env.PROFILE_SLUG }}/profile.css"
          test -s "profiles/${{ env.PROFILE_SLUG }}/profile.json"
          test -s "profiles/${{ env.PROFILE_SLUG }}/profile.md"
          test -s "profiles/${{ env.PROFILE_SLUG }}/llms.txt"

          grep -q 'application/ld+json' "profiles/${{ env.PROFILE_SLUG }}/index.html"
          grep -q 'rel="canonical"' "profiles/${{ env.PROFILE_SLUG }}/index.html"

          if grep -qi 'noindex' "profiles/${{ env.PROFILE_SLUG }}/index.html"; then
            echo "Generated public profile must not contain noindex"
            exit 1
          fi

          python3 -m json.tool \
            "profiles/${{ env.PROFILE_SLUG }}/profile.json" >/dev/null

      - name: Checkout legacy source repository
        if: ${{ env.PUBLISH_MODE == 'legacy-source' }}
        uses: actions/checkout@v4
        with:
          repository: Yumis84/otzovik-company-profile
          ref: ${{ inputs.source_ref }}
          path: _source
          token: ${{ github.token }}

      - name: Publish legacy prepared artifacts
        if: ${{ env.PUBLISH_MODE == 'legacy-source' }}
        run: |
          python3 scripts/publish-profile.py \
            --slug "${{ env.PROFILE_SLUG }}" \
            --source _source

      - name: Remove temporary source data
        if: ${{ always() }}
        run: rm -rf _source /tmp/profile.json

      - name: Validate portable hosting release
        if: ${{ env.PUBLISH_MODE == 'supabase' }}
        shell: bash
        run: |
          rm -rf /tmp/otzovik-release
          python3 scripts/build-hosting-release.py \
            --profiles profiles \
            --out /tmp/otzovik-release
          test -s /tmp/otzovik-release/manifest.json
          test -s /tmp/otzovik-release/sitemap.xml
          test -s /tmp/otzovik-release/robots.txt
          test -s /tmp/otzovik-release/otzovik-public-profiles.tar.gz
          python3 - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET

          out = pathlib.Path("/tmp/otzovik-release")
          manifest = json.loads((out / "manifest.json").read_text(encoding="utf-8"))
          if not manifest.get("profiles"):
              raise SystemExit("Release manifest contains no profiles")
          discovery = manifest.get("discovery", {})
          if set(discovery) != {"sitemap.xml", "robots.txt"}:
              raise SystemExit("Release manifest does not inventory discovery artifacts")
          ET.parse(out / "sitemap.xml")
          robots = (out / "robots.txt").read_text(encoding="utf-8")
          if "Sitemap: https://xn--b1ajuq0c.com/sitemap.xml" not in robots:
              raise SystemExit("robots.txt does not reference canonical sitemap")
          PY

      - name: Commit changed profile
        shell: bash
        run: |
          git config user.name "otzovik-profile-publisher"
          git config user.email "actions@users.noreply.github.com"

          git add "profiles/${{ env.PROFILE_SLUG }}"

          if git diff --cached --quiet; then
            echo "No profile changes"
            exit 0
          fi

          git commit -m "Publish profile: ${{ env.PROFILE_SLUG }}"
          git push

