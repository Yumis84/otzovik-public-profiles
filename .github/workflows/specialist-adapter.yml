name: Specialist public adapter isolated checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run fail-closed and loopback HTTP checks
        run: node --test tests/specialist-public.test.mjs tests/http-isolated.test.mjs
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Yumis84/otzovik-company-profile
          ref: c438d4c050ee76accf6d0333972ab4dc6b98b1ba
          path: cabinet
          persist-credentials: false
      - run: npm ci --ignore-scripts
        working-directory: cabinet
      - name: Execute disposable SQL and HTTP lifecycle
        env:
          OTZOVIK_CABINET_ROOT: ${{ github.workspace }}/cabinet
        run: node --test tests/sql-projection-isolated.test.mjs
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
        working-directory: cabinet
      - name: Check public layout and escaping
        env:
          OTZOVIK_CABINET_ROOT: ${{ github.workspace }}/cabinet
        run: node --test tests/browser-isolated.test.mjs
